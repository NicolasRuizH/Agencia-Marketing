<svg width="520" height="115" viewBox="0 0 520 115" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Growth Partners — Agencia de Marketing</title>
  <desc>Logo de Growth Partners con ícono de rayo y texto</desc>

  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="50%" stop-color="#7b5cf0"/>
      <stop offset="100%" stop-color="#6a3fc8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00c8ff"/>
      <stop offset="100%" stop-color="#6a3fc8"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square -->
  <rect x="0" y="5" width="100" height="100" rx="22" fill="url(#iconGrad)"/>

  <!-- Lightning bolt -->
  <polygon points="62,12 38,58 54,58 38,98 72,46 54,46 72,12" fill="#0d0d1f" opacity="0.85"/>
  <!-- Highlight stripe -->
  <polygon points="62,12 54,32 60,32 54,58 66,36 60,36 68,12" fill="white" opacity="0.18"/>

  <!-- "Growth" outlined -->
  <text x="116" y="56"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
    fill="none"
    stroke="#b0bcd8"
    stroke-width="1.5">Growth</text>

  <!-- "Partners" gradient fill -->
  <text x="114" y="94"
    font-family="'Syne', 'Arial Black', sans-serif"
    font-size="46"
    font-weight="800"
    letter-spacing="-1"
    fill="url(#textGrad)">Partners</text>

  <!-- Tagline -->
  <text x="118" y="112"
    font-family="'DM Sans', Arial, sans-serif"
    font-size="11.5"
    font-weight="600"
    fill="#5a6a8a"
    letter-spacing="4">AGENCIA DE MARKETING</text>
</svg>
